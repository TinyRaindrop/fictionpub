[build-system]
requires = ["setuptools>=68", "wheel", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[project]
name = "fictionpub"
description = "Convert FB2 eBooks to EPUB3."
authors = [{ name = "TinyRaindrop" }]
dynamic = ["version"]
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
keywords = ["fb2", "epub", "ebook", "converter"]

classifiers = [
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

dependencies = [
    "lxml>=5.2.0",
    "pillow>=11.0.0",
    "PySide6>=6.11.0",
]

[project.optional-dependencies]
dev = [
    # lxml support for Pylance
    "lxml-stubs>=0.5.0",

    # Formatting and linting
    "ruff>=0.7.0",

    # Type checking
    "mypy>=1.11.0",

    # Testing
    # "pytest>=8.3.0",
    # "pytest-cov>=5.0.0",

    # Build / packaging validation
    "nuitka>=2.8.8",
    "setuptools_scm>=9.0.0",
    "build>=1.2.2",
    # "twine>=5.0.0",
]

[tool.setuptools]
packages = ["fictionpub"]

[tool.setuptools_scm]
version_scheme = "post-release"
local_scheme = "no-local-version"
version_file = "fictionpub/_version.py"

[tool.ruff]
exclude = ["dist", "build", ".venv", ".*", "typography.py"]
line-length = 92
indent-width = 4
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings (e.g. trailing whitespace)
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear — catches common bugs
    "UP",   # pyupgrade — modernise syntax for py312
    "SIM",  # flake8-simplify — simplify boolean/conditional expressions
    "C4",   # flake8-comprehensions — better list/dict/set comprehensions
    "RUF",  # ruff-specific rules (e.g. unused noqa, mutable defaults)
    "N",    # pep8-naming
    "ERA",  # commented-out code detection
    "PT",   # flake8-pytest-style (if you use pytest)
    #"TID",  # tidy imports (ban relative imports etc.)
]
ignore = [
    "E501",   # line too long — handled by formatter
    "E203",   # whitespace before ':' — conflicts with formatter
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
exclude = '(dist|build)/'
python_version = "3.12"
strict = true            # enables all strict checks
ignore_missing_imports = true  # suppress errors for untyped third-party libs

[project.urls]
Homepage = "https://github.com/TinyRaindrop/fictionpub"
Issues = "https://github.com/TinyRaindrop/fictionpub/issues"

# When a user types "fictionpub", it will run main() from fictionpub/main.py
[project.scripts]
fictionpub = "fictionpub.main:main"


